services:
  - type: web
    name: bhel-portal
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/bhel_portal.sqlite
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: bhel-data
      mountPath: /var/data
      sizeGB: 1
