<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" style="background:#ffffff">

  <defs>
    <style>
      .title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-title-w { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .txt { font: 400 11.5px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .txt-sm { font: 400 10.5px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .mono { font: 600 10.5px Consolas, 'Courier New', monospace; fill: #0f172a; }
      .badge { font: 700 10px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
      .arrow-blue { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#ah-blue); }
      .arrow-dashed { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <rect x="0" y="0" width="1120" height="6" fill="url(#topGrad)"/>
  <text x="32" y="38" class="title">Frontend React Component Architecture &amp; 7-Tab Navigation Map</text>
  <text x="32" y="56" class="subtitle">Color-coded operational UI in client/src/components/ protected by AuthContext and ErrorBoundary</text>
  <line x1="32" y1="68" x2="1088" y2="68" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="88" width="1040" height="74" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 48 88 H 1072 Q 1080 88 1080 96 V 116 H 40 V 96 Q 40 88 48 88 Z" fill="#0f172a"/>
