  <text x="322" y="156" class="txt">Owning Area: PDR</text>
  <text x="322" y="173" class="txt">PDR-MECH-1..4</text>
  <text x="322" y="190" class="txt">Core assembly framing</text>
  <path d="M 535 169 L 575 169" class="arrow"/>
  <rect x="575" y="110" width="225" height="118" rx="8" fill="#f8fafc" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M 583 110 H 792 Q 800 110 800 118 V 138 H 575 V 118 Q 575 110 583 110 Z" fill="#6d28d9"/>
  <text x="587" y="129" class="box-title-w">3. HV Cabling</text>
  <text x="587" y="156" class="txt">Owning Area: PDR/CRM</text>
  <text x="587" y="173" class="txt">PDR Teams 1-5 OR</text>
  <text x="587" y="190" class="txt">CRM Teams 1-9</text>
  <path d="M 800 169 L 840 169" class="arrow"/>
  <rect x="840" y="110" width="225" height="118" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M 848 110 H 1057 Q 1065 110 1065 118 V 138 H 840 V 118 Q 840 110 848 110 Z" fill="#7c3aed"/>
