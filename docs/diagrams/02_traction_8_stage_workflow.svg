  <text x="852" y="156" class="txt">Owning Area: PDR</text>
  <text x="852" y="173" class="txt">Resonant cap, U busbar,</text>
  <text x="852" y="190" class="txt">NRV (PDR Mech)</text>
  <rect x="45" y="305" width="225" height="118" rx="8" fill="#f8fafc" stroke="#9333ea" stroke-width="1.5"/>
  <path d="M 53 305 H 262 Q 270 305 270 313 V 333 H 45 V 313 Q 45 305 53 305 Z" fill="#9333ea"/>
  <text x="57" y="324" class="box-title-w">5. LV Wiring</text>
  <text x="57" y="351" class="txt">Owning Area: PDR</text>
  <text x="57" y="368" class="txt">PDR Team 6 primary</text>
  <text x="57" y="385" class="txt">(Teams 3-5 overflow)</text>
  <path d="M 270 364 L 310 364" class="arrow"/>
  <rect x="310" y="305" width="225" height="118" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 318 305 H 527 Q 535 305 535 313 V 333 H 310 V 313 Q 310 305 318 305 Z" fill="#0284c7"/>
  <text x="322" y="324" class="box-title-w">6. Two-Test QC &amp; Testing</text>
  <text x="322" y="351" class="txt">Owning Area: KSM</text>
  <text x="322" y="368" class="txt">KSM QC &amp; External</text>
  <text x="322" y="385" class="txt">Testing (KSM tracked)</text>
  <path d="M 535 364 L 575 364" class="arrow"/>
  <rect x="575" y="305" width="225" height="118" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 583 305 H 792 Q 800 305 800 313 V 333 H 575 V 313 Q 575 305 583 305 Z" fill="#0284c7"/>
  <text x="587" y="324" class="box-title-w">7. PD Activity</text>
  <text x="587" y="351" class="txt">Owning Area: KSM</text>
  <text x="587" y="368" class="txt">KSM-OP-1 / KSM-OP-2</text>
  <text x="587" y="385" class="txt">Cover &amp; dressing</text>
  <path d="M 800 364 L 840 364" class="arrow"/>
  <rect x="840" y="305" width="225" height="118" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
  <path d="M 848 305 H 1057 Q 1065 305 1065 313 V 333 H 840 V 313 Q 840 305 848 305 Z" fill="#059669"/>
  <text x="852" y="324" class="box-title-w">8. PQ &amp; Dispatch</text>
  <text x="852" y="351" class="txt">Owning Area: KSM</text>
  <text x="852" y="368" class="txt">KSM QC / Despatch</text>
  <text x="852" y="385" class="txt">-&gt; Status: Done</text>
  <path d="M 960 228 L 960 265 L 157 265 L 157 305" class="arrow"/>
  <rect x="45" y="455" width="1020" height="125" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <path d="M 53 455 H 1057 Q 1065 455 1065 463 V 483 H 45 V 463 Q 45 455 53 455 Z" fill="#334155"/>
  <text x="57" y="474" class="box-title-w">Operational State Transitions, Holds, Overload Gate &amp; Undo Governance</text>
  <text x="57" y="501" class="txt">Panel Lifecycle Statuses: Waiting -&gt; Start Stage (worker check + capacity check HTTP 409) -&gt; In Progress -&gt; Complete Stage -&gt; Next Stage (Waiting) or Done</text>
  <text x="57" y="518" class="txt">Interruptions: Any In Progress panel can transition to Held with mandatory reason (logged to hold_history) and Resume back to In Progress</text>
  <text x="57" y="535" class="txt">Admin Undo (POST /api/panels/:id/undo): AKR/CKG only; reverses 1 completed stage at a time; blocked if next stage already In Progress or Held</text>
  <text x="57" y="552" class="txt">Legacy Migration Mapping: Historical stage_history stage numbers 7, 8, 9, 10 map cleanly to consolidated stages 6, 7, 8 via getStageDefinition()</text>
</svg>
